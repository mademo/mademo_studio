name: Deploy WordPress theme and plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build front-end for WordPress
        run: BUILD_TARGET=wordpress npm run build

      - name: Validate deployment secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST || secrets.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER || secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
        run: |
          for var in SSH_PRIVATE_KEY SSH_HOST SSH_USER DEPLOY_PATH; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret or config: $var"
              exit 1
            fi
          done

          if [[ "$DEPLOY_PATH" != /* ]]; then
            echo "DEPLOY_PATH must be an absolute filesystem path, got: $DEPLOY_PATH"
            exit 1
          fi

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST || secrets.SSH_HOST }}
        run: |
          if [ -z "${SSH_PRIVATE_KEY:-}" ] || [ -z "${SSH_HOST:-}" ]; then
            echo "SSH credentials not configured; skipping SSH setup"
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Deploy theme and plugin to WordPress
        env:
          SSH_HOST: ${{ vars.SSH_HOST || secrets.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER || secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
        run: |
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ] || [ -z "${DEPLOY_PATH:-}" ]; then
            echo "Deployment config missing; skipping deploy"
            exit 0
          fi

          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH/themes/mademo' '$DEPLOY_PATH/plugins/mademo-studio'"

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist/.vite' \
            wordpress/theme/mademo/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/themes/mademo/"

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            --exclude='.git' \
            --exclude='node_modules' \
            wordpress/plugin/mademo-studio/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/plugins/mademo-studio/"
